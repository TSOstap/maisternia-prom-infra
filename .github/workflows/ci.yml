# Тести — лише вручну (Actions → ci → Run workflow). Рішення власника 03.11: хвилини GitHub (приватний репозиторій, 2 000 / міс) —
# для кнопок таблиці; повний набір тестів запускається локально перед кожним push. Без секретів, без мережі до магазину.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # жорстка межа витрати хвилин
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # токен GitHub не лишається в git-конфігу runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # залежностей немає; без автоматичного кешу
      - run: npm test
