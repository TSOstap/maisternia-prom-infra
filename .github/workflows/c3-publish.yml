# C3: публікація YML у Cloudflare Workers Free (Static Assets, Worker mm-feed-poc). ЛИШЕ СИНТЕТИКА.
# Запуск тільки вручну (workflow_dispatch). Розкладу немає й не вмикати без погодження власника.
# Справжні товарні дані, чинні YML і Prom тут не використовуються.
name: c3-publish
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "normal — звичайна публікація; інші — навмисні збої для перевірки захисту (очікуваний відкат/відмова)"
        type: choice
        options: [normal, corrupt-byte, missing-part, upload-fail]
        default: normal
      products:
        description: "Кількість синтетичних товарів (5121 ≈ 49 МБ)"
        default: "5121"
permissions:
  contents: read
concurrency:
  group: c3-publish        # дві публікації одночасно не йдуть
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # жорстка межа витрати хвилин
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: wrangler (версія закріплена lockfile)
        working-directory: poc/c3-assets
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm ci --no-audit --no-fund
      - name: Публікація і перевірка
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MM_FEED_KEY: ${{ secrets.MM_FEED_KEY }}
          SCENARIO: ${{ inputs.scenario }}
          PRODUCTS: ${{ inputs.products }}
          WRANGLER_SEND_METRICS: "false"
        run: node tools/cf-publish.mjs --synthetic="$PRODUCTS" --scenario="$SCENARIO"
