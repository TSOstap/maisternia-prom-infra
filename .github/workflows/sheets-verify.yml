# Етапи C2-B / C2-C: ЛИШЕ ЧИТАННЯ робочої Google-таблиці через Sheets API.
#   mode=sheets          — перевірка 5121 товарів двох фідів (C2-B);
#   mode=supplier-shadow — shadow-звірка з живим фідом постачальника (C2-C): паритет LIVE↔нова система на тому
#                          самому XML, порівняння з таблицею з урахуванням часу mtUpdate, сценарії D1/D1b. Без запису.
#   mode=shadow-publish  — C3-2: реальний ОСНОВНИЙ YML новим конвеєром, байт-у-байт проти LIVE (VM) на тому самому
#                          знімку, перевірка цін/знижок/наявності; лише після PASS — тіньова публікація в Cloudflare
#                          Workers Free (окремий ключ MM_SHADOW_FEED_KEY, без Prom). Таблицю й чинні YML не змінює.
#   mode=copy-merge / copy-sync / copy-scenario — S1: ЗАПИС лише в ТЕСТОВУ КОПІЮ таблиці (MM_TEST_SHEET_ID, службовий
#                          акаунт — «Редактор» лише копії). Жива таблиця: «Читач»; код відмовляється писати, якщо ID = живої.
# Обидва режими в ОДНОМУ файлі: умова WIF у Google прив'язана саме до цього workflow (див. C2B-PLAN.md).
# Авторизація: Workload Identity Federation (OIDC) → імперсонація service account (роль «Читач» лише на цю таблицю).
# JSON-ключів немає. Токен живе 10 хв, маскується action-ом. Товарні дані не потрапляють у логи/summary/artifacts.
# Запуск лише вручну і лише з main; доступ додатково обмежено attribute-condition у Google (repository_id,
# repository_owner_id, ref, цей файл workflow) — див. C2B-PLAN.md. НЕ запускати до погодження власника.
name: sheets-verify
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sheets — перевірка таблиці (C2-B); supplier-shadow — звірка з постачальником (C2-C); shadow-publish — тіньовий реальний YML у Cloudflare (C3-2)"
        type: choice
        options: [sheets, supplier-shadow, shadow-publish, copy-merge, copy-sync, copy-scenario]
        default: sheets
permissions:
  contents: read
  id-token: write          # лише запит OIDC-токена GitHub; права запису в репозиторій не дає
concurrency:
  group: sheets-read       # не більше одного читання таблиці одночасно (квота 60 read/хв)
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # shadow-publish: + npm ci wrangler, завантаження ~50 МБ і readback
    steps:
      - name: Перевірка налаштувань (без звернень до Google)
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_SA_EMAIL }}
          SHEET: ${{ secrets.MM_SHEET_ID }}
          SUPPLIER_SET: ${{ secrets.MM_SUPPLIER_FEED_URL != '' }}
          TEST_SET: ${{ secrets.MM_TEST_SHEET_ID != '' }}
          SHADOW_SET: ${{ secrets.MM_SHADOW_FEED_KEY != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.MM_FEED_KEY != '' }}
          MODE: ${{ inputs.mode }}
        run: |
          test -n "$WIF" || { echo "Не задано змінну репозиторію GCP_WIF_PROVIDER"; exit 2; }
          test -n "$SA" || { echo "Не задано змінну репозиторію GCP_SA_EMAIL"; exit 2; }
          test -n "$SHEET" || { echo "Не задано секрет MM_SHEET_ID"; exit 2; }
          if [ "$MODE" != "sheets" ] && [ "$MODE" != "copy-merge" ] && [ "$SUPPLIER_SET" != "true" ]; then echo "Не задано секрет MM_SUPPLIER_FEED_URL"; exit 2; fi
          case "$MODE" in copy-*) [ "$TEST_SET" = "true" ] || { echo "Не задано секрет MM_TEST_SHEET_ID (тестова копія)"; exit 2; };; esac
          if [ "$MODE" = "shadow-publish" ] && [ "$SHADOW_SET" != "true" ]; then echo "Не задано секрети Cloudflare / MM_SHADOW_FEED_KEY"; exit 2; fi
          echo "Режим: $MODE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # токен GitHub не лишається в git-конфігу runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # залежностей немає; без автоматичного кешу
      - id: auth
        if: ${{ !startsWith(inputs.mode, 'copy-') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - id: authw   # S1: право запису; Google дозволяє запис лише туди, де акаунт «Редактор» (тестова копія)
        if: ${{ startsWith(inputs.mode, 'copy-') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Читання таблиці й перевірка (лише агрегати в лог)
        if: inputs.mode == 'sheets'
        env:
          MM_SHEET_ID: ${{ secrets.MM_SHEET_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/sheets-verify.mjs --source=api --replay --summary="$GITHUB_STEP_SUMMARY" --tmp="$RUNNER_TEMP"
      - name: Shadow-звірка з живим фідом постачальника (лише агрегати в лог; захист від витоку)
        if: inputs.mode == 'supplier-shadow'
        env:
          MM_SHEET_ID: ${{ secrets.MM_SHEET_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MM_SUPPLIER_FEED_URL: ${{ secrets.MM_SUPPLIER_FEED_URL }}
        run: node tools/supplier-shadow.mjs --source=api --supplier=env --scenarios --summary="$GITHUB_STEP_SUMMARY" --tmp="$RUNNER_TEMP"
      - name: wrangler для тіньової публікації (версія закріплена lockfile)
        if: inputs.mode == 'shadow-publish'
        working-directory: poc/c3-assets
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm ci --no-audit --no-fund
      - name: Тіньовий реальний YML → перевірки → Cloudflare (лише агрегати в лог; захист від витоку)
        if: inputs.mode == 'shadow-publish'
        env:
          MM_SHEET_ID: ${{ secrets.MM_SHEET_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MM_SUPPLIER_FEED_URL: ${{ secrets.MM_SUPPLIER_FEED_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MM_SHADOW_FEED_KEY: ${{ secrets.MM_SHADOW_FEED_KEY }}
          MM_FEED_KEY: ${{ secrets.MM_FEED_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: node tools/shadow-publish.mjs --source=api --supplier=env --publish --summary="$GITHUB_STEP_SUMMARY" --tmp="$RUNNER_TEMP"
      - name: S1 — запис у ТЕСТОВУ копію таблиці (лише агрегати в лог; захист від витоку)
        if: startsWith(inputs.mode, 'copy-')
        env:
          MM_SHEET_ID: ${{ secrets.MM_SHEET_ID }}
          MM_TEST_SHEET_ID: ${{ secrets.MM_TEST_SHEET_ID }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.authw.outputs.access_token }}
          MM_SUPPLIER_FEED_URL: ${{ secrets.MM_SUPPLIER_FEED_URL }}
          MODE: ${{ inputs.mode }}
        run: node tools/sheet-sync.mjs --mode="${MODE#copy-}" --source=api --summary="$GITHUB_STEP_SUMMARY"
