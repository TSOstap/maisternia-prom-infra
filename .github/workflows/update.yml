# Цикл оновлення. ЗАРАЗ: лише ручний запуск на синтетиці (без доступу до магазину).
# Розклад і реальні джерела вмикаються ОКРЕМИМ погодженням власника (CONNECT-PLAN.md, етапи C3–C5).
name: update
on:
  workflow_dispatch:
    inputs:
      products:
        description: "Кількість синтетичних товарів"
        default: "5121"
  # schedule:
  #   - cron: "17 */4 * * *"   # не на початку години: GitHub попереджає про затримки о :00
permissions:
  contents: read
concurrency:
  group: update            # аналог ScriptLock: два цикли одночасно не виконуються
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # жорстка межа витрати хвилин на один запуск
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # токен GitHub не лишається в git-конфігу runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # залежностей немає; без автоматичного кешу
      - name: Синтетичні дані
        run: node tools/synth.mjs --products=${{ inputs.products }} --new=25 --out=.data/run
      - name: Цикл оновлення (shadow, локальне сховище runner)
        # Ненульовий код виходу = збій синку або фіду → GitHub позначає запуск як failed і надсилає сповіщення.
        run: |
          node src/cli.mjs update --store=.data/store --catalog=.data/run/catalog \
            --supplier=.data/run/supplier.xml --manifest=.data/run/approved-main.json --max-bytes=2000000000 > .data/report.json
          node -e "const r=require('./.data/report.json');console.log(JSON.stringify({sync:r.sync.state,feeds:r.feeds,conflicts:r.conflicts,availability:r.availability,timingsMs:r.timingsMs}))"
